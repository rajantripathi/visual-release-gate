[project]
name = "visual-release-gate"
version = "0.1.0"
description = "Auditable multimodal release decisions for AI-generated creative assets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Rajan Prasad Tripathi" }]
keywords = ["multimodal-ai", "evaluation", "computer-vision", "governance", "human-in-the-loop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "runware-sdk",
  "streamlit>=1.42,<2",
]

[project.scripts]
visual-release-gate = "visual_release_gate.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_release_gate"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
